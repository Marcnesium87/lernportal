<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Asien Lernquiz</title>
<style>
:root{
  --bg:#f3f1ea; --ink:#1f2a37; --muted:#6b7280; --card:#ffffff; --line:#d9d5c8;
  --sea:#cfe3ee; --land:#efe6cf; --land2:#e2dfd6; --border:#b9ae92;
  --ok:#1f9d55; --bad:#d64545; --accent:#2f5d8a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;font-weight:700}
.back{color:var(--accent);font-weight:700;text-decoration:none;padding:8px 0}
#who{font-weight:600;color:var(--ink)}
.tabs{display:flex;background:#ece9df;border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:8px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff}
.hint{color:var(--muted);font-size:13px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px}
#start{border:0;background:var(--ok);color:#fff;font:inherit;font-weight:700;padding:10px 26px;border-radius:10px;cursor:pointer}
#start.run{background:var(--accent)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 14px;min-width:88px}
.stat b{display:block;font-size:20px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.cat{border:2px solid var(--c);background:var(--c);color:#fff;border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.cat.off{background:transparent;color:var(--c);opacity:.6}
.cat:disabled{cursor:not-allowed}
main{display:flex;gap:14px;padding:0 20px 20px;align-items:flex-start}
.vpwrap{flex:1;min-width:0;position:relative}
.vp{position:relative;overflow:hidden;width:100%;aspect-ratio:1000/762;max-width:max(640px,calc((100vh - 150px)*1000/762));border-radius:12px;border:1px solid var(--line);background:var(--sea);touch-action:none;cursor:grab}
.vp.pan{cursor:grabbing}
.stage{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;--s:1}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.land2{fill:var(--land2);stroke:var(--border);stroke-width:.5;vector-effect:non-scaling-stroke}
.land{fill:var(--land);stroke:var(--border);stroke-width:.6}
.land path,.land2 path,.g,.lead{vector-effect:non-scaling-stroke}
.g.line{fill:none;stroke:var(--c);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.g.ridge{fill:var(--c);fill-opacity:.9;stroke:#4a2c12;stroke-width:.5}
.g.poly{fill:var(--c);fill-opacity:.32;stroke:var(--c);stroke-width:1.5;stroke-dasharray:5 3}
.g.lake{fill:none;stroke:var(--c);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.g.country{fill:var(--c);fill-opacity:.09;stroke:var(--c);stroke-width:1.6;stroke-dasharray:2 3}
.lead{stroke:var(--c);stroke-width:1.1;opacity:.85}
.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--c);border:1.5px solid #fff;transform:translate(-50%,-50%) scale(calc(1/var(--z)));z-index:1;pointer-events:none}
.dot.cap{border-radius:2px;transform:translate(-50%,-50%) rotate(45deg) scale(calc(1/var(--z)))}
.slot{position:absolute;width:96px;height:26px;transform:translate(-50%,-50%) scale(var(--s));border:2px dashed var(--c);border-radius:6px;background:rgba(255,255,255,.93);
  display:flex;align-items:center;justify-content:center;font-size:9.5px;line-height:1.05;font-weight:700;text-align:center;z-index:2;overflow:hidden;padding:0 2px}
.slot input{width:100%;height:100%;border:0;background:transparent;text-align:center;font:inherit;font-size:11px;color:var(--ink);outline:none;padding:0}
.slot input::placeholder{color:#9aa3ad;font-weight:400}
.slot.over{background:#fff7c2;scale:1.12;z-index:4}
.slot.done{border-style:solid;border-color:var(--ok);background:#dff5e7;color:#14653a}
.slot.wrong{animation:shake .4s;border-color:var(--bad);background:#fde3e3}
@keyframes shake{25%{translate:-5px 0}75%{translate:5px 0}}
.hid{display:none!important}
.veil{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(31,42,55,.35);backdrop-filter:blur(2px);text-align:center;border-radius:12px}
.veil div{background:var(--card);padding:18px 28px;border-radius:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:80%}
.veil small{display:block;font-weight:400;color:var(--muted);margin-top:4px}
.veil.hide{display:none}
.zoom{position:absolute;right:10px;top:10px;z-index:8;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:18px;font-weight:700;cursor:pointer}
.zinfo{position:absolute;left:10px;bottom:8px;z-index:8;font-size:12px;color:#334;background:rgba(255,255,255,.75);padding:2px 8px;border-radius:6px;pointer-events:none}
aside{width:250px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
aside.hide{display:none}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:6px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{padding:4px 8px;border-radius:7px;font-weight:600;font-size:12.5px;cursor:grab;user-select:none;touch-action:none;color:#fff;background:var(--c)}
.chip.gone{display:none}
.locked .chip{opacity:.5;cursor:not-allowed}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg);box-shadow:0 6px 16px rgba(0,0,0,.3)}
@media(max-width:900px){main{flex-direction:column}aside{width:100%;position:static;max-height:none}}
</style>
</head>

const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/\b(gebirge|fluss|strom|halbinsel|der|die|das)\b/g,'').replace(/[^a-z0-9]/g,'');
const lev=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length]};
const matches=(it,txt)=>{const t=norm(txt);if(!t)return false;
  return [it.name,...it.alias].some(n=>{n=norm(n);return n===t||(n.length>=6&&lev(n,t)<=1)})};

let mode=1,running=false,ok=0,bad=0,solved=new Set(),t0=0,timer=null;
const catOn=CATS.map(()=>true);
const stage=$('stage'),vp=$('vp'),leads=$('leads'),side=$('side');
const active=()=>ITEMS.filter(i=>catOn[i.cat]);

// ---- build elements
CATS.forEach((c,ci)=>{
  const b=document.createElement('button');b.className='cat';b.style.setProperty('--c',c.color);
  b.textContent=c.name+' '+ITEMS.filter(i=>i.cat===ci).length;
  b.onclick=()=>{if(running)return;catOn[ci]=!catOn[ci];b.classList.toggle('off',!catOn[ci]);setMode(mode)};
  c.btn=b;$('legend').appendChild(b);
  side.insertAdjacentHTML('beforeend',`<h2 style="--c:${c.color}" data-h="${ci}">${c.name}</h2><div class="chips" data-c="${ci}"></div>`);
});
ITEMS.forEach(it=>{
  const sx=it.sx*W/100,sy=it.sy*H/100,ax=it.ax*W/100,ay=it.ay*H/100;
  const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
  ln.setAttribute('class','lead');ln.setAttribute('x1',sx);ln.setAttribute('y1',sy);ln.setAttribute('x2',ax);ln.setAttribute('y2',ay);
  ln.style.setProperty('--c',it.color);leads.appendChild(ln);
  const d=document.createElement('div');d.className='dot'+(it.kind==='cap'?' cap':'');
  d.style.cssText=`left:${it.ax}%;top:${it.ay}%;--c:${it.color}`;stage.appendChild(d);
  const s=document.createElement('div');s.className='slot';s.id='slot'+it.id;
  s.style.cssText=`left:${it.sx}%;top:${it.sy}%;--c:${it.color}`;stage.appendChild(s);
  const c=document.createElement('div');c.className='chip';c.style.setProperty('--c',it.color);c.textContent=it.name;
  side.querySelector(`[data-c="${it.cat}"]`).appendChild(c);
  c.addEventListener('pointerdown',e=>startDrag(e,it));
  Object.assign(it,{el:s,chip:c,ln,dot:d,geo:stage.querySelector(`[data-i="${it.id}"]`)});
});
side.querySelectorAll('.chips').forEach(p=>[...p.children].sort(()=>Math.random()-.5).forEach(c=>p.appendChild(c)));

function applyCats(){
  ITEMS.forEach(it=>{const on=catOn[it.cat];
    [it.el,it.chip,it.ln,it.dot].forEach(e=>e.classList.toggle('hid',!on));
    if(it.geo)it.geo.classList.toggle('hid',!on)});
  side.querySelectorAll('[data-h],[data-c]').forEach(e=>e.classList.toggle('hid',!catOn[+(e.dataset.h??e.dataset.c)]));
}
function resetSlots(){
  ITEMS.forEach(it=>{
    it.el.className='slot'+(catOn[it.cat]?'':' hid');it.el.innerHTML='';
    it.chip.classList.remove('gone');
    if(mode===2){
      const i=document.createElement('input');i.placeholder='?';i.disabled=!running;
      i.autocomplete='off';i.spellcheck=false;
      i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check2(it,i)}});
      i.addEventListener('blur',()=>check2(it,i));
      i.addEventListener('focus',()=>reveal(it.el));
      it.el.appendChild(i);
    }
  });
}
function mark(it){
  solved.add(it.id);ok++;track(it.id);
  it.el.className='slot done';it.el.textContent=it.name;it.chip.classList.add('gone');
  update();if(solved.size===active().length)finish();
}
function fail(it){
  bad++;update();
  it.el.classList.remove('wrong');void it.el.offsetWidth;it.el.classList.add('wrong');
  setTimeout(()=>it.el.classList.remove('wrong'),450);
}
function check2(it,inp){
  if(!running||solved.has(it.id)||!inp.value.trim())return;
  if(matches(it,inp.value))mark(it);else{fail(it);inp.value=''}
}
function update(){
  $('cOk').textContent=ok;$('cBad').textContent=bad;$('cGot').textContent=solved.size+' / '+active().length;
}
function tick(){const s=Math.floor((Date.now()-t0)/1000);$('cTime').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function veil(html){$('veilTxt').innerHTML=html;$('veil').classList.toggle('hide',!html)}
function lockCats(v){CATS.forEach(c=>c.btn.disabled=v)}
function finish(){
  running=false;clearInterval(timer);lockCats(false);$('start').textContent='Neustart';$('start').classList.remove('run');
  const tot=ok+bad,pct=tot?Math.round(ok/tot*100):0;
  veil(`Geschafft! 🎉<small>${ok} richtig · ${bad} falsch · Trefferquote ${pct}% · Zeit ${$('cTime').textContent}</small><small>„Neustart" drücken für eine neue Runde</small>`);
}
function setMode(m){
  mode=m;running=false;clearInterval(timer);lockCats(false);
  $('m1').classList.toggle('on',m===1);$('m2').classList.toggle('on',m===2);
  side.classList.toggle('hide',m===2);side.classList.add('locked');
  $('desc').textContent=m===1?'Ziehe die Namen per Drag & Drop auf die leeren Felder.':'Tippe den Namen ins Feld, Enter bestätigt.';
  ok=bad=0;solved.clear();update();$('cTime').textContent='0:00';
  $('start').textContent='Start';$('start').classList.remove('run');
  applyCats();resetSlots();
  veil(active().length?`Spiel ${m} bereit<small>Drücke „Start", um die Runde zu beginnen.</small>`:'Bitte mindestens ein Thema aktivieren.');
}
function start(){
  if(!active().length)return;
  ok=bad=0;solved.clear();update();
  running=true;lockCats(true);side.classList.remove('locked');
  resetSlots();veil('');
  $('start').textContent='Neustart';$('start').classList.add('run');
  t0=Date.now();clearInterval(timer);timer=setInterval(tick,500);tick();
}
$('start').onclick=start;
$('m1').onclick=()=>setMode(1);$('m2').onclick=()=>setMode(2);

// ---- zoom & pan
let z=1,tx=0,ty=0;
function view(){
  const w=vp.clientWidth,h=vp.clientHeight;
  tx=Math.min(0,Math.max(w-w*z,tx));ty=Math.min(0,Math.max(h-h*z,ty));
  stage.style.width=w+'px';stage.style.height=h+'px';
  stage.style.transform=`translate(${tx}px,${ty}px) scale(${z})`;
  const s=(0.62+0.38*Math.min(1,(z-1)/2))/z;
  stage.style.setProperty('--s',s);stage.style.setProperty('--z',z);
}
function zoomAt(f,mx,my){
  const nz=Math.min(10,Math.max(1,z*f));
  tx=mx-(mx-tx)*nz/z;ty=my-(my-ty)*nz/z;z=nz;view();
}
vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY*0.0018),e.clientX-r.left,e.clientY-r.top)},{passive:false});
vp.addEventListener('scroll',()=>{vp.scrollLeft=vp.scrollTop=0});
const ptrs=new Map();let lastD=0;
vp.addEventListener('pointerdown',e=>{
  if(e.target.closest('.slot,.veil'))return;
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);vp.setPointerCapture(e.pointerId);vp.classList.add('pan');
  lastD=0;
});
vp.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const p=ptrs.get(e.pointerId);
  if(ptrs.size===1){tx+=e.clientX-p[0];ty+=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;view()}
  else{
    p[0]=e.clientX;p[1]=e.clientY;
    const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),r=vp.getBoundingClientRect();
    if(lastD)zoomAt(d/lastD,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top);
    lastD=d;
  }
});
const endp=e=>{ptrs.delete(e.pointerId);lastD=0;if(!ptrs.size)vp.classList.remove('pan')};
vp.addEventListener('pointerup',endp);vp.addEventListener('pointercancel',endp);
const zc=f=>zoomAt(f,vp.clientWidth/2,vp.clientHeight/2);
$('zi').onclick=()=>zc(1.5);$('zo').onclick=()=>zc(1/1.5);$('zr').onclick=()=>{z=1;tx=ty=0;view()};
function reveal(el){
  const v=vp.getBoundingClientRect(),r=el.getBoundingClientRect(),m=30;
  let dx=0,dy=0;
  if(r.left<v.left+m)dx=v.left+m-r.left;else if(r.right>v.right-m)dx=v.right-m-r.right;
  if(r.top<v.top+m)dy=v.top+m-r.top;else if(r.bottom>v.bottom-m)dy=v.bottom-m-r.bottom;
  if(dx||dy){tx+=dx;ty+=dy;view()}
}
addEventListener('resize',view);

function startDrag(e,it){
  if(!running||mode!==1||solved.has(it.id))return;
  e.preventDefault();
  const g=it.chip.cloneNode(true);g.classList.add('ghost');document.body.appendChild(g);
  let over=null;
  const move=ev=>{
    g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';
    const el=document.elementFromPoint(ev.clientX,ev.clientY);
    const s=el&&el.closest('.slot:not(.done)');
    if(over!==s){over&&over.classList.remove('over');over=s;over&&over.classList.add('over')}
  };
  const up=()=>{
    document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',up);
    g.remove();over&&over.classList.remove('over');
    if(!over)return;
    const target=ITEMS[+over.id.slice(4)];
    if(target===it)mark(it);else fail(target);
  };
  move(e);
  document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
}
