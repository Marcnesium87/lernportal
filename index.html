<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161C" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lernportal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: eine Spalte (max 960px). Hub = Suche + Filter + Kachelraster. Modul = Kopfzeile + Reiter (Karteikarten / Quiz). Fachfarbe steuert Karten und Tags. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --fg:#16202B; --muted:#56616D; --line:#D6DCD4;
  --geschichte:#8C2F39; --on-geschichte:#FFFFFF;
  --erdkunde:#0E6A62; --on-erdkunde:#FFFFFF;
  --ethik:#5B3FA0; --on-ethik:#FFFFFF;
  --englisch:#9A4A00; --on-englisch:#FFFFFF;
  --good:#1E7B3A; --bad:#B3261E; --focus:#2B5BD7;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161C; --surface:#1A222B; --fg:#E9EDF1; --muted:#9AA6B2; --line:#2C3742;
    --geschichte:#E2848E; --on-geschichte:#2A0C10;
    --erdkunde:#4CC2B5; --on-erdkunde:#05211E;
    --ethik:#B7A4F0; --on-ethik:#1D1236;
    --englisch:#F0A560; --on-englisch:#2A1300;
    --good:#5FD08A; --bad:#FF8A80; --focus:#8FB0FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#1A222B; --fg:#E9EDF1; --muted:#9AA6B2; --line:#2C3742;
  --geschichte:#E2848E; --on-geschichte:#2A0C10;
  --erdkunde:#4CC2B5; --on-erdkunde:#05211E;
    --ethik:#B7A4F0; --on-ethik:#1D1236;
    --englisch:#F0A560; --on-englisch:#2A1300;
  --good:#5FD08A; --bad:#FF8A80; --focus:#8FB0FF; color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
*{box-sizing:border-box}
[data-fach="geschichte"]{--c:var(--geschichte);--on:var(--on-geschichte)}
[data-fach="erdkunde"]{--c:var(--erdkunde);--on:var(--on-erdkunde)}
[data-fach="ethik"]{--c:var(--ethik);--on:var(--on-ethik)}
[data-fach="englisch"]{--c:var(--englisch);--on:var(--on-englisch)}
.wrap{max-width:960px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.9rem;letter-spacing:-.02em;background:none;border:0;padding:0}
.hint{color:var(--muted);font-size:.95rem;margin:0}

/* Hub */
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:44px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mod{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.mod:hover{border-color:var(--c)}
.mod:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.tag{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.mod h2{font-size:1.5rem}
.mod .bar{display:block}
.mod .prog b{color:var(--fg)}
.mod .prog span{white-space:nowrap}
.mod p{margin:0;color:var(--muted);font-size:.98rem}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);margin-top:auto;font-variant-numeric:tabular-nums}
.meta b{color:var(--fg)}
.empty{padding:28px 0;color:var(--muted)}

/* Modul */
.head{display:flex;flex-direction:column;gap:8px}
.back{align-self:flex-start;background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700;min-height:44px}
.head h1{font-size:clamp(2rem,6vw,3rem);color:var(--c)}
.tabs{display:flex;gap:8px}
.tab{flex:1 1 0;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:700;min-height:48px}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:var(--on)}

.extra{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:2px solid var(--c);border-radius:12px;background:var(--surface);color:var(--fg);text-decoration:none;min-height:52px}
.extra b{color:var(--c)}
.extra span{color:var(--muted);font-size:.92rem}
.extra:hover{background:color-mix(in srgb,var(--c) 8%,var(--surface))}

/* Lernkarten */
.learn{display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:240px;padding:28px 24px;border-radius:18px;background:var(--surface);border:2px solid var(--line);border-left:8px solid var(--c)}
.learn .lbl{font-family:var(--font-display);font-weight:800;font-size:clamp(1.4rem,5vw,1.9rem);line-height:1.15;color:var(--c);overflow-wrap:anywhere}
.learn .bonus{align-self:flex-start;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--c);color:var(--on);border-radius:999px;padding:3px 12px}
.learn .txt{font-size:clamp(1.1rem,3.6vw,1.3rem);line-height:1.5;overflow-wrap:anywhere}

/* Karteikarten */
.deck{display:flex;flex-direction:column;gap:14px}
.prog{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);width:0;transition:width .25s}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;min-height:260px;padding:28px 22px;border-radius:18px;background:var(--surface);border:2px solid var(--line);width:100%}
.card:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.card .lbl{font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.card .txt{font-family:var(--font-display);font-weight:600;font-size:clamp(1.3rem,4.5vw,1.8rem);line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.card.back-side{background:var(--c);border-color:var(--c);color:var(--on)}
.card .tap{font-size:.85rem;opacity:.7}
.row{display:flex;gap:10px}
.btn{flex:1 1 0;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;font-weight:700;min-height:52px}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.again{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:14px}
.q{font-family:var(--font-display);font-weight:600;font-size:clamp(1.3rem,4.5vw,1.7rem);line-height:1.25;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;min-height:52px;overflow-wrap:anywhere}
.opt:not([disabled]):hover{border-color:var(--c)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.opt[disabled]{cursor:default}
.expl{padding:12px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line)}
.res{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:28px 16px;background:var(--surface);border:2px solid var(--line);border-radius:18px}
.score{font-family:var(--font-display);font-weight:800;font-size:4rem;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
.foot{color:var(--muted);font-size:.85rem}
/* Nutzer */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.usr{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px 5px 5px;min-height:44px;max-width:62%;min-width:0}
.usr .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.av{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:hsl(var(--h) 55% 36%);color:#fff;font-family:var(--font-display);font-weight:800}
.av.big{width:72px;height:72px;font-size:2rem}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.pick{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;text-align:center;font-weight:700;overflow-wrap:anywhere;min-width:0}
.pick:hover{border-color:var(--fg)}
.pick:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.newu{display:flex;gap:10px;flex-wrap:wrap}
.head h1.plain{color:var(--fg)}
.who-h{display:flex;align-items:center;gap:14px;min-width:0}
.prow{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.prow h2{font-size:1.3rem}
.prow .btn{flex:none;align-self:flex-start;margin-top:4px;padding-inline:20px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.err{color:var(--bad);min-height:1.4em;margin:0}
.form{display:flex;flex-direction:column;gap:10px;max-width:420px}
.fld{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>
<body>

<script>
/* ===== Inhalte: neue Module hier als Objekt ergänzen ===== */
var MODULES = [
  {
    id:"asien", title:"Asien", fach:"erdkunde", stufe:"5–7",
    desc:"Hauptstädte, Berge, Flüsse und Klima des größten Kontinents.",
    map:{url:"asien-quiz.html", total:59},
    cards:[],
    quiz:[]
  },
  {
    id:"neuzeit", thema:"reformation", lern:true, title:"Aufbruch in die Neuzeit", fach:"geschichte", stufe:"7",
    desc:"Renaissance, Humanismus und ein neues Bild von der Welt.",
    cards:[
      ["Mittelalter und Neuzeit","Etwa um das Jahr 1500 endet das Mittelalter und die Neuzeit beginnt. Im Mittelalter haben die meisten Menschen geglaubt, was die Kirche ihnen erklärt hat. Jetzt fangen immer mehr Menschen an, selbst zu beobachten, zu forschen und nachzufragen."],
      ["Renaissance","Renaissance ist ein französisches Wort und bedeutet „Wiedergeburt“. Künstler und Gelehrte entdeckten die Kunst und das Wissen der alten Griechen und Römer neu. Sie nahmen sich die Antike zum Vorbild, zum Beispiel für Gebäude, Bilder und Statuen."],
      ["Humanismus","Die Humanisten waren Gelehrte, die den Menschen in den Mittelpunkt stellten. Ihnen waren Bildung und eigenes Denken wichtig. Sie lasen die alten Schriften im Original, also in ihrer ursprünglichen Sprache, und prüften selbst, was darin steht."],
      ["Nikolaus Kopernikus","Lange glaubten die Menschen, dass die Erde im Mittelpunkt des Weltalls steht. Nikolaus Kopernikus rechnete und beobachtete und kam zu einem anderen Ergebnis: Die Sonne steht in der Mitte, und die Erde bewegt sich um sie herum. Das war eine riesige Neuigkeit, weil es dem alten Weltbild widersprach."],
      ["Leonardo da Vinci","Leonardo da Vinci lebte in Italien und konnte fast alles: Er war Maler, Erfinder und Naturforscher. Er malte die berühmte Mona Lisa und das Bild „Das Abendmahl“. Außerdem zeichnete er Pläne für Maschinen und sogar für Flugapparate, die damals noch niemand bauen konnte."],
      ["Fragen statt nur glauben","In dieser Zeit entdeckten Seefahrer wie Christoph Kolumbus neue Länder. Dadurch merkten die Menschen: Die Welt ist größer und anders, als wir dachten. Viele fragten deshalb mehr nach, auch bei der Kirche. Das bereitete den Boden für die Reformation."]
    ],
    quiz:[
      {q:"Was bedeutet das Wort „Renaissance“?",a:["Wiedergeburt","Erfindung","Entdeckung","Reformation"],c:0,e:"„Renaissance“ heißt Wiedergeburt: Man entdeckte die Kunst und das Wissen der alten Griechen und Römer neu."},
      {q:"Wer erkannte, dass die Sonne im Mittelpunkt steht?",a:["Nikolaus Kopernikus","Johannes Gutenberg","Martin Luther","Christoph Kolumbus"],c:0,e:"Kopernikus fand heraus: Die Sonne steht in der Mitte, die Erde bewegt sich um sie. Vorher glaubte man, die Erde sei der Mittelpunkt."},
      {q:"Was war Leonardo da Vinci?",a:["Maler, Erfinder und Naturforscher","Kaiser und Feldherr","Mönch und Prediger","Kaufmann und Seefahrer"],c:0,e:"Leonardo konnte vieles: Er malte die Mona Lisa, erforschte die Natur und zeichnete Pläne für Maschinen."},
      {q:"Was war den Humanisten besonders wichtig?",a:["Der Mensch, Bildung und eigenes Denken","Möglichst viel Land zu erobern","Der Handel mit Gewürzen","Strenger Gehorsam gegenüber allen Herrschern"],c:0,e:"Humanisten wollten, dass Menschen gebildet sind und selbst nachdenken, statt nur zu glauben, was man ihnen sagt."},
      {q:"Was ist ein typischer Unterschied der Neuzeit zum Mittelalter?",a:["Man erklärt die Welt zunehmend durch Beobachten und Forschen","Es gibt keine Kirche mehr","Alle Menschen können lesen und schreiben","Es gibt keine Könige mehr"],c:0,e:"In der Neuzeit wollen die Menschen Dinge selbst beobachten und prüfen, statt sich nur auf alte Lehren zu verlassen."}
    ]
  },
  {
    id:"gutenberg", thema:"reformation", lern:true, title:"Gutenberg und der Buchdruck", fach:"geschichte", stufe:"7",
    desc:"Wie der Buchdruck Wissen für viele Menschen möglich machte.",
    cards:[
      ["Bücher vor Gutenberg","Früher gab es keine Druckmaschinen. Jedes Buch musste von Hand abgeschrieben werden, meistens von Mönchen in den Klöstern. Für ein einziges Buch brauchte man Monate. Deshalb waren Bücher sehr teuer, und nur reiche Leute und Klöster besaßen welche."],
      ["Gutenbergs Erfindung","Um das Jahr 1450 erfand Johannes Gutenberg in Mainz den Buchdruck mit beweglichen Lettern. Er goss einzelne Buchstaben aus Metall und setzte daraus Wörter und ganze Seiten zusammen. Die Seite wurde mit Druckerschwärze eingefärbt und auf Papier gepresst. Danach konnte man die Buchstaben für die nächste Seite wiederverwenden."],
      ["Die Gutenberg-Bibel","Das berühmteste Buch, das Gutenberg druckte, war die Bibel, auf Latein. Man nennt sie die Gutenberg-Bibel. Einige Exemplare gibt es noch heute, und sie sind sehr wertvoll."],
      ["Wissen für viele","Mit dem Buchdruck konnte man viele gleiche Bücher in kurzer Zeit herstellen. Dadurch wurden Bücher billiger, und mehr Menschen lernten lesen. Vorher hatten vor allem Kirche und Adel Zugang zu Wissen. Dieses Wissensmonopol, also dass nur wenige Bescheid wussten, wurde nun gebrochen."],
      ["Ideen verbreiten sich schnell","Mit der neuen Technik konnte man auch Flugschriften drucken, das sind kurze, billige Blätter und Heftchen. Nachrichten und neue Ideen kamen so in wenigen Wochen in viele Städte. Ohne den Buchdruck hätte sich Luthers Lehre nicht so schnell in ganz Deutschland verbreitet."],
      ["Und heute?","Was damals der Buchdruck war, ist heute das Internet. Wissen und Nachrichten verbreiten sich blitzschnell. Doch nicht alles, was man liest, stimmt. Deshalb muss man immer prüfen, woher eine Information kommt."]
    ],
    quiz:[
      {q:"Was erfand Gutenberg um 1450 in Mainz?",a:["Den Buchdruck mit beweglichen Lettern","Das Schießpulver","Den Kompass","Die Uhr"],c:0,e:"Gutenberg goss einzelne Buchstaben aus Metall, setzte daraus Seiten zusammen und druckte sie. Die Buchstaben ließen sich immer wieder verwenden."},
      {q:"Wie wurden Bücher vor Gutenberg hergestellt?",a:["Von Hand abgeschrieben","Mit Maschinen gedruckt","Aus Stein gemeißelt","Mit dem Computer"],c:0,e:"Vor dem Buchdruck schrieben vor allem Mönche in Klöstern die Bücher mit der Hand ab. Das dauerte sehr lange."},
      {q:"Warum brach der Buchdruck das Wissensmonopol von Kirche und Adel?",a:["Bücher wurden billiger und viele Menschen konnten lernen","Bücher wurden verboten","Nur noch Mönche durften lesen","Es gab weniger Bücher"],c:0,e:"Bücher wurden billiger, und mehr Menschen konnten lesen und lernen. Wissen gehörte nicht mehr nur der Kirche und dem Adel."},
      {q:"Was ist heute mit der Bedeutung des Buchdrucks von damals vergleichbar?",a:["Das Internet","Das Fahrrad","Der Kühlschrank","Die Eisenbahn"],c:0,e:"Beide bringen Wissen und Nachrichten schnell zu vielen Menschen."},
      {q:"Welches Werk druckte Gutenberg als berühmtestes Buch?",a:["Die Bibel","Ein Kochbuch","Eine Landkarte","Ein Märchenbuch"],c:0,e:"Die Gutenberg-Bibel ist sein berühmtestes Werk."}
    ]
  },
  {
    id:"luther", thema:"reformation", lern:true, title:"Martin Luther", fach:"geschichte", stufe:"7",
    desc:"Vom Mönch zum Reformator: 95 Thesen, Wartburg und Bibelübersetzung.",
    cards:[
      ["Luthers Leben","Martin Luther wurde am 10. November 1483 in Eisleben geboren. Sein Vater wollte, dass er Jurist wird, also Rechtsanwalt oder Richter. Doch 1505 geriet Luther in ein schlimmes Gewitter, bekam große Angst und versprach, Mönch zu werden. Dieses Versprechen hielt er."],
      ["Der Ablass","Die Kirche verkaufte damals Ablassbriefe. Wer Geld bezahlte, dem sollten angeblich seine Sünden und die Strafen dafür erlassen werden. Die Kirche brauchte das Geld unter anderem für den Bau des Petersdoms in Rom. Luther fand das falsch: Gottes Vergebung kann man nicht kaufen."],
      ["Die 95 Thesen","Am 31. Oktober 1517 machte Luther in Wittenberg seine 95 Thesen bekannt. Thesen sind Behauptungen, über die man diskutieren möchte. Luther war in Wittenberg Professor und kritisierte darin den Ablasshandel. Ob er die Thesen wirklich an die Kirchentür nagelte, ist unter Historikern umstritten. Dieses Datum gilt als Beginn der Reformation."],
      ["Der Buchdruck hilft","Luthers Thesen wurden abgeschrieben, gedruckt und in ganz Deutschland verteilt, schon nach wenigen Wochen. Auch seine späteren Schriften wurden gedruckt und gern gelesen. So wussten bald viele Menschen, was Luther dachte."],
      ["Der Reichstag zu Worms","Der Papst und der Kaiser wollten, dass Luther aufhört. 1521 musste er in Worms vor Kaiser Karl V. erscheinen. Der Kaiser verlangte, dass Luther seine Lehren widerruft, also zurücknimmt. Luther weigerte sich. Deshalb verhängte der Kaiser die Reichsacht: Luther war nun geächtet und sollte festgenommen werden."],
      ["Luther auf der Wartburg","Auf dem Heimweg von Worms ließ Kurfürst Friedrich der Weise Luther zum Schein überfallen und versteckte ihn auf der Wartburg bei Eisenach. Dort lebte Luther unter dem Namen „Junker Jörg“. In nur etwa 11 Wochen übersetzte er das Neue Testament aus dem Griechischen ins Deutsche."],
      ["Die Lutherbibel","Bis dahin gab es die Bibel für die meisten Menschen nur auf Latein, und das konnten sie nicht lesen. Luther schrieb in einem Deutsch, das jeder verstand. Das Neue Testament erschien 1522, die ganze Bibel 1534. Luthers Sprache prägte das Deutsch, das wir heute schreiben."],
      ["Katharina von Bora","Katharina von Bora war früher Nonne und floh aus ihrem Kloster. 1525 heiratete sie Martin Luther. In Wittenberg führte sie den großen Haushalt mit Kindern, Studenten und Gästen.",1],
      ["Zwei Kirchen","Reformation heißt „Erneuerung“. Luther wollte die Kirche verbessern, nicht spalten. Aber der Streit wurde so groß, dass eine neue Kirche entstand: die evangelische (protestantische) Kirche. Daneben blieb die katholische Kirche bestehen."],
      ["Luthers Tod","Luther starb am 18. Februar 1546 in Eisleben, also in der Stadt, in der er geboren wurde. Er war 62 Jahre alt. Der Reformationstag am 31. Oktober erinnert bis heute an den Tag der 95 Thesen. In Sachsen ist er ein Feiertag."]
    ],
    quiz:[
      {q:"In welchem Jahr machte Luther die 95 Thesen bekannt?",a:["1492","1517","1555","1648"],c:1,e:"Das war 1517, am 31. Oktober. Dieses Datum gilt als Beginn der Reformation."},
      {q:"In welcher Stadt wirkte Luther als Professor und veröffentlichte die Thesen?",a:["Rom","Wittenberg","Berlin","Köln"],c:1,e:"Luther lehrte in Wittenberg. Die Stadt heißt heute Lutherstadt Wittenberg."},
      {q:"Auf welcher Burg übersetzte Luther das Neue Testament?",a:["Burg Eltz","Wartburg","Burg Hohenzollern","Burg Meißen"],c:1,e:"Die Wartburg liegt bei Eisenach in Thüringen. Dort war Luther versteckt."},
      {q:"Welche Erfindung half Luther, seine Ideen zu verbreiten?",a:["Dampfmaschine","Telefon","Buchdruck","Kompass"],c:2,e:"Mit dem Buchdruck konnte man Luthers Schriften schnell vervielfältigen und überall verteilen."},
      {q:"Wer verlangte 1521 in Worms, dass Luther widerruft?",a:["Friedrich der Weise","Johann Tetzel","Kaiser Karl V.","Gutenberg"],c:2,e:"Der Kaiser verhängte danach die Reichsacht über Luther. Friedrich der Weise beschützte ihn."},
      {q:"Wen heiratete Luther 1525?",a:["Katharina von Bora","Maria Theresia","Elisabeth von Thüringen","Katharina die Große"],c:0,e:"Katharina von Bora war früher Nonne und floh aus dem Kloster."},
      {q:"Welche Kirche entstand aus der Reformation?",a:["Die orthodoxe Kirche","Die evangelische Kirche","Die jüdische Gemeinde","Die buddhistische Gemeinde"],c:1,e:"Die evangelische (protestantische) Kirche. Daneben blieb die katholische Kirche bestehen."},
      {q:"In welcher Stadt wurde Luther geboren und starb er auch?",a:["Wittenberg","Eisleben","Erfurt","Eisenach"],c:1,e:"Eisleben heißt heute Lutherstadt Eisleben. Dort wurde Luther geboren und starb auch dort."}
    ]
  },
  {
    id:"sachsen", thema:"reformation", lern:true, title:"Sachsen, Kernland der Reformation", fach:"geschichte", stufe:"7",
    desc:"Wittenberg, Kurfürst und Maler: Die Reformation und ihre sächsischen Spuren.",
    cards:[
      ["Sachsen und die Reformation","Das Land Sachsen sah damals anders aus als heute. Um Wittenberg lag Kursachsen, dessen Kurfürst Luther beschützte. Um Dresden und Leipzig herrschte Herzog Georg, der Luthers Gegner war. Wittenberg liegt heute in Sachsen-Anhalt."],
      ["Wittenberg","Wittenberg war damals eine kleine Universitätsstadt an der Elbe. Hier lehrte Luther als Professor, hier schrieb er viele seiner Schriften, und hier lebte er mit seiner Familie. Darum heißt die Stadt heute offiziell Lutherstadt Wittenberg."],
      ["Friedrich der Weise","Friedrich der Weise war Kurfürst von Sachsen und einer der mächtigsten Fürsten im Reich. Er hatte die Universität in Wittenberg gegründet. Er schützte Luther, auch als der Kaiser ihn verfolgte, und versteckte ihn auf der Wartburg."],
      ["Lucas Cranach","Lucas Cranach der Ältere war ein berühmter Maler und lebte in Wittenberg. Er war mit Luther befreundet und malte viele Bilder von ihm und seiner Familie, die wir noch heute kennen. Außerdem gestaltete er Flugschriften und Bibeln mit Bildern."],
      ["Die Leipziger Disputation","1519 trafen sich Luther und der Theologe Johannes Eck in Leipzig zu einem öffentlichen Streitgespräch. Das nennt man Disputation. Es ging darum, wer in Glaubensfragen das letzte Wort hat: der Papst oder die Bibel. Luther sagte, die Bibel steht über dem Papst. Danach war der Streit mit der Kirche nicht mehr zu retten.",1],
      ["Sachsen heute","In Sachsen ist der Reformationstag am 31. Oktober ein gesetzlicher Feiertag. Viele Orte erinnern an die Reformation, zum Beispiel Wittenberg mit dem Lutherhaus und der Schlosskirche. Bei einem Ausflug kannst du diese Orte selbst entdecken."]
    ],
    quiz:[
      {q:"In welcher Stadt lehrte Luther als Professor?",a:["Wittenberg","Dresden","Chemnitz","Bautzen"],c:0,e:"Luther lehrte an der Universität Wittenberg. Die Stadt heißt heute Lutherstadt Wittenberg."},
      {q:"Welcher Kurfürst von Sachsen schützte Luther?",a:["Friedrich der Weise","Karl V.","August der Starke","Ludwig XIV."],c:0,e:"Friedrich der Weise war Kurfürst von Sachsen. Er ließ Luther auf der Wartburg verstecken."},
      {q:"In welcher Stadt stritt Luther 1519 mit Johannes Eck?",a:["Leipzig","Worms","Eisenach","Rom"],c:0,e:"In Leipzig fand 1519 das Streitgespräch statt, die Leipziger Disputation."},
      {q:"Welcher Maler lebte in Wittenberg und war mit Luther befreundet?",a:["Lucas Cranach der Ältere","Albrecht Dürer","Leonardo da Vinci","Michelangelo"],c:0,e:"Cranach lebte in Wittenberg und malte viele Bilder von Luther und seiner Familie."},
      {q:"Wie heißt Wittenberg heute offiziell?",a:["Lutherstadt Wittenberg","Reformationsstadt Wittenberg","Bibelstadt Wittenberg","Thesenstadt Wittenberg"],c:0,e:"Der Zusatz „Lutherstadt“ erinnert an Martin Luther."}
    ]
  },
  {
    id:"folgen", thema:"reformation", lern:true, title:"Folgen der Reformation", fach:"geschichte", stufe:"7",
    desc:"Glaubensspaltung, Gegenreformation, Kriege und Glaubensfreiheit.",
    cards:[
      ["Zwei Kirchen","Luther wollte die Kirche erneuern, nicht spalten. Doch der Papst und die Anhänger Luthers einigten sich nicht. Deshalb gab es bald zwei Kirchen: die katholische und die evangelische (protestantische) Kirche. Man nennt das Glaubensspaltung."],
      ["Die Fürsten entscheiden","Viele Fürsten fanden Luthers Lehre gut. Manche glaubten wirklich daran, andere wollten auch mehr Macht und Besitz. Sie führten in ihrem Land die evangelische Kirche ein. Ihre Untertanen mussten dann meist auch evangelisch werden."],
      ["Gegenreformation","Die katholische Kirche wollte ihre Gläubigen nicht verlieren. Auf einem großen Kirchentreffen, dem Konzil von Trient, beschloss sie Verbesserungen. Neue Orden wie die Jesuiten gründeten Schulen und predigten, um die Menschen zurückzugewinnen. Das nennt man Gegenreformation."],
      ["Streit wird zum Krieg","Evangelische und katholische Fürsten misstrauten einander. Sie schlossen Bündnisse, und es kam zu Kriegen. Dabei ging es nicht nur um den Glauben, sondern auch um Macht, Land und Einfluss."],
      ["Augsburger Religionsfrieden","1555 schlossen die Fürsten im Reich in Augsburg einen Frieden. Er sagte: Der Landesherr bestimmt, ob sein Land katholisch oder lutherisch ist. Wer eine andere Religion hatte, durfte auswandern. Echte Glaubensfreiheit für alle war das noch nicht.",1],
      ["Dreißigjähriger Krieg","Von 1618 bis 1648 wurde in Europa 30 Jahre lang Krieg geführt, vor allem in Deutschland. Der Streit zwischen den Religionen war ein Grund, aber auch Macht spielte eine große Rolle. Viele Städte und Dörfer wurden zerstört, und sehr viele Menschen starben durch Gewalt, Hunger und Krankheiten. Der Krieg endete mit dem Westfälischen Frieden.",1],
      ["Glaubensfreiheit","Glaubensfreiheit bedeutet: Jeder darf selbst entscheiden, woran er glaubt, und niemand darf ihn dafür bestrafen. Das war damals keine Selbstverständlichkeit. Heute steht die Glaubensfreiheit im Grundgesetz."]
    ],
    quiz:[
      {q:"Was war eine Folge des Streits um die Kirche?",a:["Die Spaltung in katholische und evangelische Kirche","Die Abschaffung des Glaubens","Die Gründung der Universitäten","Das Ende der Fürsten"],c:0,e:"Seit der Reformation gibt es in Deutschland evangelische und katholische Christen."},
      {q:"Was bedeutet „Gegenreformation“?",a:["Die katholische Kirche wollte die Reformation zurückdrängen","Luther nahm seine Thesen zurück","Die Fürsten stimmten Luther zu","Die Bauern gründeten eine eigene Kirche"],c:0,e:"Die katholische Kirche wehrte sich und wollte Gläubige zurückgewinnen."},
      {q:"Was regelte der Augsburger Religionsfrieden von 1555?",a:["Der Landesherr bestimmt die Religion seines Landes","Alle Menschen müssen katholisch sein","Jeder Mensch darf seine Religion frei wählen","Die Kirche darf keine Steuern mehr verlangen"],c:0,e:"Die Menschen konnten ihre Religion noch nicht frei wählen. Das entschied der Landesherr."},
      {q:"Was bedeutet Glaubensfreiheit?",a:["Jeder darf selbst entscheiden, woran er glaubt","Alle müssen dieselbe Religion haben","Nur der Herrscher darf glauben","Religion ist verboten"],c:0,e:"Die Glaubensfreiheit steht heute im Grundgesetz."},
      {q:"Welcher Krieg von 1618 bis 1648 hatte auch religiöse Ursachen?",a:["Der Dreißigjährige Krieg","Der Hundertjährige Krieg","Der Siebenjährige Krieg","Der Erste Weltkrieg"],c:0,e:"Im Dreißigjährigen Krieg ging es um den Glauben, aber auch um Macht."}
    ]
  },
  {
    id:"bilder", thema:"reformation", lern:true, title:"Bilder und Flugschriften", fach:"geschichte", stufe:"7",
    desc:"Wie man Bildquellen aus der Reformationszeit liest.",
    cards:[
      ["Bildquellen","Alte Bilder, Zeichnungen und Gemälde sind Quellen. Sie zeigen uns, wie Menschen damals gelebt und gedacht haben. Aber ein Bild zeigt nicht immer die Wahrheit. Der Künstler wollte oft etwas Bestimmtes ausdrücken. Deshalb muss man Bildquellen genau untersuchen."],
      ["Flugschriften","Flugschriften waren kurze, billige Blätter und Heftchen. Sie wurden auf Märkten verkauft und von Hand zu Hand weitergegeben. Damit verbreiteten sich Meinungen und Nachrichten sehr schnell, auch Luthers Ideen. Man kann sie mit heutigen Flyern oder Posts vergleichen."],
      ["Bilder für alle","Viele Menschen konnten damals nicht oder nur schlecht lesen. Darum hatten Flugschriften oft Bilder, zum Beispiel Zeichnungen und Holzschnitte. So verstanden auch Menschen, die nicht lesen konnten, worum es ging. Manchmal machten sich die Bilder auch über Gegner lustig."],
      ["Bibelillustrationen","Die Lutherbibel hatte Holzschnitte, das sind Bilder, die in Holz geschnitten und dann gedruckt wurden. Sie zeigten Geschichten aus der Bibel, zum Beispiel die Erschaffung der Welt. So konnte man die Geschichten besser verstehen und sich merken."],
      ["Altarbilder","Der Altar steht vorne in der Kirche. Auf Altarbildern waren früher meist Heilige zu sehen. Im Wittenberger Reformationsaltar von Cranach sieht man dagegen die evangelische Lehre: Taufe, Abendmahl, Beichte und Luther, der von der Kanzel predigt. Das Bild zeigt den Menschen, was in der neuen Kirche wichtig ist."],
      ["Bildquellen auswerten","Wenn du ein altes Bild untersuchst, hilft dir diese Reihenfolge: Was ist zu sehen? Wer hat das Bild gemacht, und wann? Für wen und wozu wurde es gemacht? Was wollte der Künstler damit sagen?"]
    ],
    quiz:[
      {q:"Was ist eine Flugschrift?",a:["Ein billiges, kurzes Druckblatt zur Verbreitung von Meinungen","Ein Brief des Kaisers","Ein Buch über Vögel","Ein Schiffslogbuch"],c:0,e:"Flugschriften waren billig und schnell gedruckt. So verbreiteten sich Meinungen und Nachrichten schnell."},
      {q:"Warum hatten Flugschriften oft Bilder?",a:["Viele Menschen konnten nicht lesen","Texte waren verboten","Bilder waren Pflicht","Es gab keine Buchstaben"],c:0,e:"Viele Menschen konnten nicht lesen. Bilder konnten auch sie verstehen."},
      {q:"Welche Fragen stellt man zuerst an eine Bildquelle?",a:["Wer hat es gemacht, wann und wozu?","Wie teuer war der Rahmen?","Wie viele Farben wurden benutzt?","Wo hängt es heute im Haus?"],c:0,e:"Wer, wann und wozu: Damit findet man heraus, was ein Bild aussagen will."},
      {q:"Wozu dienten Bibelillustrationen?",a:["Sie erklärten Geschichten aus der Bibel anschaulich","Sie waren nur Verzierung ohne Bedeutung","Sie zeigten Landkarten","Sie ersetzten den Text"],c:0,e:"Die Holzschnitte machten Geschichten aus der Bibel leicht verständlich."},
      {q:"Was zeigt der Wittenberger Reformationsaltar von Cranach?",a:["Taufe, Abendmahl, Beichte und Luthers Predigt","Die Schlacht bei Worms","Die Erfindung des Buchdrucks","Kaiser Karl V. auf dem Thron"],c:0,e:"Der Altar zeigt Dinge, die in der evangelischen Kirche wichtig sind."}
    ]
  },
  {
    id:"eth-logik", thema:"ethisch-argumentieren", lern:true, title:"Logik: richtig schlussfolgern", fach:"ethik", stufe:"8 · Gymnasium",
    desc:"Syllogismus, Deduktion, Induktion und Wahrheitstabellen als Werkzeug fürs Argumentieren.",
    cards:[
      ["Wozu Logik?","Logik ist die Lehre vom richtigen Schlussfolgern. Wer argumentiert, will andere mit Gründen überzeugen. Das gelingt nur, wenn die Gründe so zusammenhängen, dass die Behauptung wirklich aus ihnen folgt. Genau das prüft die Logik."],
      ["Der klassische Syllogismus","Ein Syllogismus ist ein Schluss aus zwei Voraussetzungen, den Prämissen, auf eine Folgerung, die Konklusion. Das bekannteste Beispiel: Alle Menschen sind sterblich. Sokrates ist ein Mensch. Also ist Sokrates sterblich. Sind beide Prämissen wahr und ist der Schluss richtig gebaut, muss auch die Konklusion wahr sein."],
      ["Deduktion","Bei der Deduktion schließt man vom Allgemeinen auf den Einzelfall. Aus der Regel „Stehlen ist verboten“ und der Feststellung „Das war Stehlen“ folgt: Diese Handlung ist verboten. Stimmen die Voraussetzungen und ist der Schluss richtig, ist das Ergebnis sicher."],
      ["Induktion","Bei der Induktion schließt man von vielen Einzelfällen auf eine allgemeine Regel. Beispiel: Du siehst viele Schwäne, und alle sind weiß. Du schließt: Alle Schwäne sind weiß. Das Ergebnis ist aber nur wahrscheinlich, denn ein einziger schwarzer Schwan widerlegt die Regel."],
      ["Wahrheitstabellen","Mit einer Wahrheitstabelle prüft man, wann eine zusammengesetzte Aussage wahr ist. Jede einzelne Aussage ist entweder wahr (w) oder falsch (f). „A und B“ ist nur wahr, wenn beide Aussagen wahr sind. „A oder B“ ist schon wahr, wenn mindestens eine der beiden wahr ist."],
      ["Gültig ist nicht gleich wahr","Ein Schluss kann logisch gültig sein und trotzdem zu einer falschen Konklusion führen, wenn eine Prämisse falsch ist. Beispiel: Alle Vögel können fliegen. Ein Pinguin ist ein Vogel. Also kann ein Pinguin fliegen. Der Aufbau ist richtig, aber die erste Prämisse ist falsch. Deshalb muss man immer beides prüfen: den Aufbau und die Wahrheit der Voraussetzungen."]
    ],
    quiz:[
      {q:"Was ist ein Syllogismus?",a:["Ein Schluss aus zwei Prämissen auf eine Konklusion","Eine Sammlung von Gefühlen","Ein Streitgespräch mit Publikum","Eine Tabelle mit Zahlen"],c:0,e:"Ein Syllogismus verbindet zwei Voraussetzungen (Prämissen) zu einer Folgerung (Konklusion), zum Beispiel: Alle Menschen sind sterblich, Sokrates ist ein Mensch, also ist Sokrates sterblich."},
      {q:"Was beschreibt die Deduktion?",a:["Den Schluss vom Allgemeinen auf den Einzelfall","Den Schluss von vielen Einzelfällen auf eine Regel","Den Schluss vom Gefühl auf die Wahrheit","Den Schluss von einer Person auf eine andere"],c:0,e:"Deduktion geht von einer allgemeinen Regel aus und wendet sie auf einen Einzelfall an."},
      {q:"Warum ist das Ergebnis einer Induktion nur wahrscheinlich?",a:["Ein einziger Gegenfall kann die Regel widerlegen","Induktion ist immer falsch","Man braucht dafür keine Beobachtungen","Sie gilt nur in der Mathematik"],c:0,e:"Auch wenn alle bisher beobachteten Schwäne weiß waren: Ein schwarzer Schwan genügt, um die Regel zu widerlegen."},
      {q:"Wann ist die Aussage „A und B“ in einer Wahrheitstabelle wahr?",a:["Nur wenn A und B beide wahr sind","Wenn mindestens eine der beiden wahr ist","Wenn beide falsch sind","Immer"],c:0,e:"„Und“ verlangt, dass beide Aussagen wahr sind. Bei „oder“ genügt eine."},
      {q:"Alle Vögel können fliegen. Ein Pinguin ist ein Vogel. Also kann ein Pinguin fliegen. Was stimmt?",a:["Der Schluss ist gültig, aber eine Prämisse ist falsch","Der Schluss ist ungültig, obwohl alle Prämissen wahr sind","Alles daran ist wahr","Die Konklusion ist damit bewiesen"],c:0,e:"Der Aufbau ist richtig, doch „Alle Vögel können fliegen“ ist falsch. Darum ist auch die Konklusion falsch."}
    ]
  },
  {
    id:"eth-begriffe", thema:"ethisch-argumentieren", lern:true, title:"Grundbegriffe des Argumentierens", fach:"ethik", stufe:"8 · Gymnasium",
    desc:"Argument, Stützung, Norm und die typischen Arten von Gründen: Tatsache, Gefühl, Folgen, Autorität, Gewissen.",
    cards:[
      ["Was ist ein Argument?","Ein Argument ist eine Begründung für eine Behauptung, die man These nennt. Es besteht aus der These, also dem, was man zeigen will, und mindestens einem Grund, der sie stützt. Beispiel: „Man sollte nicht schwarzfahren, weil dadurch die anderen Fahrgäste die Kosten mittragen.“"],
      ["Stützung eines Arguments","Oft braucht ein Argument selbst noch einen weiteren Grund, damit es überzeugt. Das nennt man Stützung. Beispiel: Das Argument „Schwarzfahren schadet anderen“ wird gestützt durch „Die Verkehrsbetriebe finanzieren sich auch aus Fahrkarten.“ So entsteht eine Kette von Gründen."],
      ["Tatsache","Ein Tatsachenargument beruft sich auf etwas, das man überprüfen kann, zum Beispiel eine Zahl oder ein Ereignis. In der Ethik reicht das nicht allein: Aus „So ist es“ folgt nicht automatisch „So soll es sein“. Dafür braucht man zusätzlich eine moralische Norm."],
      ["Gefühl","Gefühle wie Mitleid, Wut oder Scham können Hinweise geben, dass etwas moralisch wichtig ist. Als alleiniger Grund sind sie schwach, weil Gefühle bei Menschen verschieden sind und sich ändern. Ein starkes Argument erklärt, warum das Gefühl berechtigt ist."],
      ["Folgen","Ein Folgenargument fragt: Was passiert, wenn man so handelt? Man betrachtet Nutzen und Schaden für alle Betroffenen. Schwierig ist, dass man die Folgen oft nicht sicher vorhersagen kann."],
      ["Moralische Autoritäten","Man kann sich auf Personen, Texte oder Gemeinschaften berufen, die als moralisch maßgeblich gelten, zum Beispiel Eltern, Gesetze, religiöse Schriften oder Vorbilder. Dieses Argument überzeugt aber nur Menschen, die diese Autorität anerkennen. Deshalb sollte man fragen, warum die Autorität recht hat."],
      ["Gewissen","Das Gewissen ist die innere Stimme, die uns sagt, ob eine Handlung richtig oder falsch ist. Es wird durch Erziehung und Erfahrung geprägt. Wer sich auf das Gewissen beruft, sollte erklären können, worauf es sich stützt, damit andere es nachvollziehen können."],
      ["Moralische Normen","Moralische Normen sind Regeln, die sagen, was man tun oder lassen soll, etwa „Du sollst nicht stehlen“ oder „Hilf Menschen in Not“. Sie sind die Grundlage jeder ethischen Argumentation. Anders als Gesetze muss der Staat sie nicht durchsetzen."],
      ["Die Goldene Regel","„Was du nicht willst, dass man dir tu, das füg auch keinem andern zu.“ Diese Regel findet man in vielen Kulturen und Religionen. Sie hilft zu prüfen, ob eine Handlung fair ist: Würde ich selbst so behandelt werden wollen?",1],
      ["Kants Prüfstein","Der Philosoph Immanuel Kant fragte: Könnte meine Handlungsregel für alle Menschen gelten? Wenn nicht, ist sie moralisch nicht in Ordnung. Das nennt man den kategorischen Imperativ. Er passt zum Argumentieren, weil er verlangt, Gründe zu nennen, die für alle gelten.",1]
    ],
    quiz:[
      {q:"Woraus besteht ein Argument?",a:["Aus einer These und mindestens einem stützenden Grund","Nur aus einer Behauptung","Nur aus einem Gefühl","Aus einer Tabelle und einer Zeichnung"],c:0,e:"Ein Argument begründet eine Behauptung (These) mit mindestens einem Grund."},
      {q:"Warum reicht eine Tatsache allein in der Ethik nicht aus?",a:["Aus „So ist es“ folgt nicht „So soll es sein“","Tatsachen sind immer falsch","Tatsachen darf man nicht nennen","Man kann Tatsachen nicht prüfen"],c:0,e:"Zusätzlich braucht man eine moralische Norm, die sagt, was man tun oder lassen soll."},
      {q:"Was fragt ein Folgenargument?",a:["Was passiert, wenn man so handelt?","Wer hat es früher erlaubt?","Wie fühlt sich der Redner?","Wie alt ist die Regel?"],c:0,e:"Ein Folgenargument betrachtet Nutzen und Schaden für alle Betroffenen."},
      {q:"Warum ist ein Gefühl allein ein schwaches Argument?",a:["Gefühle sind verschieden und ändern sich","Gefühle gibt es nicht","Gefühle sind immer falsch","Man darf nicht fühlen"],c:0,e:"Gefühle können Hinweise geben, aber andere müssen sie nicht teilen. Ein gutes Argument erklärt, warum das Gefühl berechtigt ist."},
      {q:"Was ist eine moralische Norm?",a:["Eine Regel, die sagt, was man tun oder lassen soll","Ein Naturgesetz","Eine Messung","Ein mathematischer Beweis"],c:0,e:"Beispiele sind „Du sollst nicht stehlen“ oder „Hilf Menschen in Not“."},
      {q:"Bonus: Was besagt die Goldene Regel?",a:["Behandle andere so, wie du selbst behandelt werden willst","Wer zahlt, bestimmt","Gold ist wertvoller als Silber","Gehorche immer dem Stärkeren"],c:0,e:"Die Goldene Regel gibt es in vielen Kulturen und Religionen. Sie hilft, die Fairness einer Handlung zu prüfen."}
    ]
  },
  {
    id:"eth-pruefen", thema:"ethisch-argumentieren", lern:true, title:"Argumentationen prüfen", fach:"ethik", stufe:"8 · Gymnasium",
    desc:"Argumente sammeln, gewichten, vergleichen und auf Schlüssigkeit prüfen.",
    cards:[
      ["Argumente sammeln","Am Anfang sammelt man alle Argumente, auch die der Gegenseite. Dabei hilft eine Tabelle mit zwei Spalten: Pro (dafür) und Kontra (dagegen). Wer nur die Argumente für die eigene Meinung kennt, kann sie nicht fair prüfen."],
      ["Argumente gewichten","Nicht jedes Argument ist gleich stark. Man gewichtet sie und fragt: Wie schwer wiegt der mögliche Schaden? Wie viele Menschen sind betroffen? Wie sicher ist das Argument? Ein einzelnes gewichtiges Argument kann mehrere schwache aufwiegen."],
      ["Argumente verknüpfen und vergleichen","Gute Argumente hängen zusammen und stützen sich gegenseitig. Man verknüpft sie mit Wörtern wie „weil“, „deshalb“, „außerdem“ und „dagegen spricht“. Beim Vergleichen stellt man Pro und Kontra gegenüber und fragt, welche Seite insgesamt besser begründet ist."],
      ["Argumentationsstrukturen erkennen","Eine Argumentation besteht aus einer Behauptung, einer Begründung und oft einer Stützung. Um sie zu erkennen, fragt man: Was wird behauptet? Womit wird es begründet? Welche Regel steckt dahinter, die nicht ausgesprochen wird?"],
      ["Schlüssigkeit prüfen","Eine Argumentation ist schlüssig, wenn aus den Gründen die Behauptung wirklich folgt. Man prüft: Sind die Gründe wahr? Folgt daraus die Behauptung? Wurde etwas Wichtiges weggelassen? Häufige Fehler sind das Verallgemeinern nach nur einem Fall, das Angreifen der Person statt ihrer Argumente und das Arbeiten nur mit Gefühlen."],
      ["Argumentationsspiele","In Argumentationsspielen übt man das Begründen. Zum Beispiel muss man eine Position verteidigen, die man selbst nicht vertritt, oder zu einem Argument das beste Gegenargument finden. So lernt man, andere Sichtweisen zu verstehen."],
      ["Thesenreflexion","Bei der Thesenreflexion prüft man die eigene Meinung kritisch. Man fragt: Warum glaube ich das? Welche Gründe sprechen dafür, welche dagegen? Würde ich meine Meinung ändern, wenn ich neue Argumente höre? Wer das kann, nimmt Abstand zur eigenen Position."]
    ],
    quiz:[
      {q:"Wozu dient eine Pro-Kontra-Tabelle?",a:["Um Argumente beider Seiten zu sammeln","Um den Gegner zu beleidigen","Um Noten zu berechnen","Um Gefühle zu verstecken"],c:0,e:"Wer beide Seiten kennt, kann die eigene Meinung fair prüfen."},
      {q:"Was bedeutet „Argumente gewichten“?",a:["Ihre Stärke einschätzen und vergleichen","Sie möglichst lang aufschreiben","Sie nur zählen und die Mehrheit nehmen","Sie vergessen"],c:0,e:"Man fragt, wie schwer ein Schaden wiegt, wie viele Menschen betroffen sind und wie sicher das Argument ist."},
      {q:"Wann ist eine Argumentation schlüssig?",a:["Wenn aus wahren Gründen die Behauptung folgt","Wenn sie laut vorgetragen wird","Wenn alle klatschen","Wenn sie kurz ist"],c:0,e:"Schlüssig heißt: Die Gründe stimmen, und die Behauptung folgt wirklich aus ihnen."},
      {q:"Welcher Fehler ist ein typisches Scheinargument?",a:["Die Person angreifen statt ihr Argument zu prüfen","Eine Quelle nennen","Ein Beispiel bringen","Eine Gegenposition anhören"],c:0,e:"Wer die Person angreift, widerlegt ihr Argument nicht."},

  {

    desc:"Ethisch argumentieren an Fällen: Diebstahl, Schwarzfahren, Organspende, Umwelt und Migration.",
    cards:[
      ["Handlungen ethisch begründen","Wer eine Handlung ethisch begründet, beantwortet die Frage: Warum ist es richtig oder falsch, so zu handeln? Dazu nennt man Gründe wie Folgen, moralische Normen, die Rechte anderer oder das Gewissen. Das übt man an Fällen aus Alltag und Gesellschaft."],
      ["Fall Diebstahl","Jemand nimmt im Laden etwas mit, ohne zu bezahlen. Dagegen spricht: Das Eigentum anderer wird verletzt, und das Vertrauen im Zusammenleben leidet. Man kann auch fragen, ob es Ausnahmen gibt, zum Beispiel bei großer Not. Dann muss man die Gründe sorgfältig gegeneinander abwägen."],
      ["Fall Schwarzfahren","Wer ohne Fahrschein fährt, spart Geld, aber die anderen Fahrgäste tragen die Kosten mit. Man kann den Verallgemeinerungstest anwenden: Was wäre, wenn alle schwarzfahren würden? Dann gäbe es bald keinen Nahverkehr mehr."],
      ["Fall Organspende","Eine Organspende kann kranken Menschen das Leben retten. Dafür spricht der große Nutzen. Zur Vorsicht mahnen kann das Recht, über den eigenen Körper selbst zu bestimmen. Umstritten ist, ob man ausdrücklich zustimmen muss oder ob man widersprechen muss, wenn man nicht spenden will. Es gibt dazu verschiedene Positionen mit jeweils eigenen Gründen."],
      ["Fall Ökologie und Konsum","Viele Menschen möchten viel einkaufen und reisen. Gleichzeitig belasten Herstellung und Transport das Klima. Mit Folgen argumentiert man: Wer nachhaltig lebt, schützt die Umwelt auch für spätere Generationen. Dagegen steht der Wunsch nach Wohlstand. Man fragt außerdem, wer welche Verantwortung trägt: einzelne Menschen, Firmen oder der Staat."],
      ["Fall Flucht und Migration","Menschen verlassen ihre Heimat wegen Krieg, Verfolgung oder Armut. Ethisch geht es darum, welche Pflicht Staaten haben, Schutz zu bieten, und wie man die Belastungen gerecht verteilt. Dazu gibt es verschiedene Positionen. Ethisch argumentieren heißt, die Gründe aller Seiten fair zu prüfen."],
      ["Das Metagespräch","Ein Metagespräch ist ein Gespräch über das Gespräch. Danach fragt man: Wie haben wir argumentiert? Welche Gründe waren stark? Wo haben wir aneinander vorbeigeredet? So lernt man, die eigene Argumentation zu verbessern."]
    ],
    quiz:[
      {q:"Was prüft man mit der Frage „Was wäre, wenn alle so handeln würden?“",a:["Ob die Handlungsregel für alle gelten könnte","Wie viel Geld man spart","Wer zuerst gehandelt hat","Wie schnell etwas geht"],c:0,e:"Das ist der Verallgemeinerungstest. Er hängt mit Kants Prüfstein zusammen."},
      {q:"Welches Argument spricht gegen Schwarzfahren?",a:["Die anderen Fahrgäste tragen die Kosten mit","Fahrkarten sind bunt","Busse sind groß","Es gibt Haltestellen"],c:0,e:"Außerdem könnte der Nahverkehr nicht bestehen, wenn alle schwarzfahren würden."},
      {q:"Was ist bei der Organspende ein zentraler Streitpunkt?",a:["Ob man ausdrücklich zustimmen oder widersprechen muss","Welche Farbe die Spenderkarte hat","Wie schnell operiert wird","Wer das Krankenhaus baut"],c:0,e:"Man wägt den Nutzen für Kranke gegen das Recht ab, über den eigenen Körper zu bestimmen."},
      {q:"Was ist ein Metagespräch?",a:["Ein Gespräch über das vorherige Gespräch und die Argumentation","Ein Gespräch im Internet","Ein Gespräch ohne Regeln","Ein Streit"],c:0,e:"Man prüft, wie argumentiert wurde und was besser gehen kann."},

  {
    id:"eth-gestalten", thema:"ethisch-argumentieren", lern:true, title:"Ethisch diskutieren und entscheiden", fach:"ethik", stufe:"8 · Gymnasium",
    desc:"Konsens und Dissens, Sokratisches Gespräch, Pro-Kontra-Debatte und Podiumsdiskussion.",
    cards:[
      ["Konsens und Dissens","Konsens heißt, dass sich alle auf eine gemeinsame Lösung einigen. Dissens heißt, dass die Meinungen verschieden bleiben. In der Ethik muss nicht immer ein Konsens entstehen. Wichtig ist, dass man Unterschiede aushält und die Gründe der anderen versteht."],
      ["Ethik und Politik","Eine ethische Argumentation fragt, was moralisch richtig ist, und nennt dafür Gründe. Eine politische Entscheidung wird von Parlamenten oder Regierungen getroffen und gilt danach für alle als Gesetz, auch wenn nicht jeder sie gut findet. Ethik kann die Politik beraten, ersetzt sie aber nicht."],
      ["Das Sokratische Gespräch","Der Philosoph Sokrates stellte Fragen, statt Antworten zu geben. Im Sokratischen Gespräch klärt eine Gruppe gemeinsam durch Nachfragen, was man unter einem Begriff wie „Gerechtigkeit“ versteht. Dabei prüft man Beispiele und widerlegt voreilige Antworten."],
      ["Die Pro-Kontra-Debatte","In einer Pro-Kontra-Debatte vertreten zwei Seiten gegensätzliche Positionen zu einer Streitfrage. Jede Seite trägt ihre Argumente vor und antwortet auf die der anderen. Eine Jury oder das Publikum entscheidet, wer überzeugender war. Dabei spielt keine Rolle, welche Meinung man privat hat."],
      ["Die Podiumsdiskussion","Bei einer Podiumsdiskussion sitzen mehrere Personen mit verschiedenen Standpunkten vor Publikum. Eine Moderatorin oder ein Moderator leitet das Gespräch, stellt Fragen und achtet darauf, dass alle zu Wort kommen. Danach kann das Publikum Fragen stellen."],
      ["Fair diskutieren","Gute Regeln für ethische Diskussionen: ausreden lassen, die Sache angreifen und nicht die Person, Behauptungen begründen und Gegenargumente ernst nehmen. Am Ende kann man festhalten, worüber man sich einig ist und wo man verschiedener Meinung bleibt."]

    quiz:[

      {q:"Wodurch unterscheidet sich eine politische Entscheidung von einer ethischen Argumentation?",a:["Sie wird von dafür zuständigen Stellen getroffen und gilt dann für alle","Sie braucht keine Gründe","Sie ist immer moralisch richtig","Sie kommt nur im Unterricht vor"],c:0,e:"Ethik liefert Gründe und kann beraten. Die verbindliche Entscheidung trifft die Politik."},
      {q:"Was zeichnet ein Sokratisches Gespräch aus?",a:["Gemeinsames Nachfragen, um einen Begriff zu klären","Ein Vortrag des Lehrers","Eine Abstimmung","Eine Prüfung mit Noten"],c:0,e:"Sokrates fragte nach, statt Antworten zu geben."},

    out[k] = {best: x.best==null ? (y.best==null ? null : y.best) : (y.best==null ? x.best : Math.max(x.best,y.best)), tries:Math.max(x.tries||0,y.tries||0), cards:Math.max(x.cards||0,y.cards||0), last:n.last==null ? null : n.last, at:n.at||0, found:Object.keys(fo).map(Number)};

function me(){ return store.cur; }

/* Quiz-Fortschritt: Kartenquiz = gefundene Begriffe, sonst letzter Durchlauf */
function qTot(m){ return m.map ? m.map.total : m.quiz.length; }

/* ===== Hub ===== */

function val(id){ var e = document.getElementById(id); return e ? e.value : ""; }
function fail(msg, id){ var e = document.getElementById("err"); if (e) e.textContent = msg; var f = id && document.getElementById(id); if (f) f.focus(); }
var ERR = {exists:"Diesen Namen gibt es schon. Melde dich damit an oder wähle einen anderen.", wrong:"Name oder PIN stimmt nicht.", locked:"Zu viele Fehlversuche. Bitte in 5 Minuten noch einmal versuchen.", name:"Der Name muss 1 bis 20 Zeichen haben.", pin:"Die PIN besteht aus 4 bis 6 Ziffern."};
function submit(){
  if (S.busy) return;
  var name = val("neuname").replace(/\s+/g," ").trim(), pin = val("pin"), neu = S.mode==="new";
  if (!name) return fail("Bitte einen Namen eingeben.","neuname");
  if (!/^\d{4,6}$/.test(pin)) return fail(ERR.pin,"pin");
  if (neu && pin!==val("pin2")) return fail("Die beiden PINs sind verschieden.","pin2");
  if (!CONFIG.url) return fail("Die Online-Speicherung ist noch nicht eingerichtet.");
  S.busy = true; fail("");
  var b = document.getElementById("go"); b.disabled = true; b.textContent = "Einen Moment …";
  api(neu ? "lp_register" : "lp_login", {p_name:name, p_pin:pin}).then(function(r){
    S.busy = false;
    if (r && r.ok){
      store.cur = {name:r.name, hue:r.hue, pin:pin}; store.prog = r.prog || {}; S.mode = "login"; S.sync = "";
      saveLocal(); afterLogin();
    } else {
      b.disabled = false; b.textContent = neu ? "Anlegen" : "Anmelden";
      fail(ERR[r && r.error] || "Das hat nicht geklappt. Bitte noch einmal versuchen.");
    }
  }).catch(function(){
    S.busy = false; b.disabled = false; b.textContent = neu ? "Anlegen" : "Anmelden";
    fail("Keine Verbindung. Bitte das Internet prüfen.");
  });
}
function clearUser(){
  clearTimeout(saveTimer); saveTimer = null;
  store.cur = null; store.prog = {}; S.sync = ""; S.delask = false; S.view = "who"; S.mode = "login";
  saveLocal(); go(); window.scrollTo(0,0);
}
function syncIn(){
  var c = store.cur; if (!c) return;
  api("lp_login", {p_name:c.name, p_pin:c.pin}).then(function(r){
    if (r && r.ok){
      store.prog = mergeProg(r.prog, store.prog); saveLocal(); push();
      if (S.view==="hub" || S.view==="me") go();
    } else if (r && (r.error==="wrong")) clearUser();
  }).catch(function(){ setSync("Offline: Fortschritt ist nur auf diesem Gerät gespeichert."); });
}
function afterLogin(){
  var id = (location.hash||"").replace("#","");
  if (!(id && openHash(id))) home();
}
function openHash(id){
  if (mod(id)){ openMod(id); return true; }
  if (themaOf(id)){ openThema(id); return true; }
  return false;
}

/* ===== Steuerung ===== */
function go(){
  var el = document.getElementById("suche"), hadFocus = el && document.activeElement===el, pos = el ? el.selectionStart : 0;
  if (S.view==="who") renderWho();
  else if (S.view==="me") renderMe();
  else if (S.view==="hub"){
    renderHub();
    if (hadFocus){ var n = document.getElementById("suche"); n.focus(); try { n.setSelectionRange(pos,pos); } catch(e){} }
  } else if (S.view==="thema") renderThema();
  else renderMod();
}
function openThema(id){
  if (!themaOf(id) || !me()) return;
  S.view="thema"; S.thema=id; S.mod=null;
  go(); window.scrollTo(0,0);
}
function openMod(id, tab){
  if (!mod(id) || !me()) return;
  S.view="mod"; S.mod=id; S.tab=tab||"cards"; newDeck(); newQuiz();
  go(); window.scrollTo(0,0);
}
function home(){ S.view = me() ? "hub" : "who"; S.mod=null; S.delask=false; go(); window.scrollTo(0,0); }

app.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-a]"); if (!t || t.disabled) return;
  var a = t.getAttribute("data-a"), v = t.getAttribute("data-v");
  if (a==="home"){ try { history.replaceState(null,"",location.pathname+location.search); } catch(e){} home(); }
  else if (a==="open"){ try { location.hash = v; } catch(e){} openMod(v); }
  else if (a==="thema"){ try { location.hash = v; } catch(e){} openThema(v); }
  else if (a==="lnext"){ if (S.d.i < S.d.total-1){ S.d.i++; renderLern(); } }
  else if (a==="lprev"){ if (S.d.i > 0){ S.d.i--; renderLern(); } }
  else if (a==="fach"){ S.fach = v; go(); }
  else if (a==="me"){ S.view="me"; S.delask=false; go(); window.scrollTo(0,0); }
  else if (a==="submit"){ submit(); }
  else if (a==="mode"){ S.mode = S.mode==="new" ? "login" : "new"; renderWho(); }
  else if (a==="logout"){ push(); clearUser(); }
  else if (a==="delask"){ S.delask = true; renderMe(); }
  else if (a==="delcancel"){ S.delask = false; renderMe(); }
  else if (a==="deluser"){
    var u = me(); if (!u) return;
    api("lp_delete", {p_name:u.name, p_pin:u.pin}).then(function(r){
      if (r && r.ok) clearUser(); else setSync("Löschen hat nicht geklappt.");
    }).catch(function(){ setSync("Keine Verbindung. Löschen hat nicht geklappt."); });
  }
  else if (a==="tab"){ S.tab = v; if (v==="quiz" && (S.z.done)) newQuiz(); renderMod(); }
  else if (a==="flip"){ S.d.flip = !S.d.flip; renderCards(); }
  else if (a==="know"){ S.d.queue.shift(); S.d.known++; S.d.flip=false; var pc = P(S.mod); if (S.d.known>pc.cards){ pc.cards = S.d.known; save(); } renderCards(); }
  else if (a==="again"){ S.d.queue.push(S.d.queue.shift()); S.d.flip=false; renderCards(); }
  else if (a==="redeck"){ newDeck(); renderCards(); }
  else if (a==="pick"){
    var z = S.z; if (z.pick!==null) return;
    z.pick = +v; if (z.qs[z.i].opts[z.pick].ok) z.score++;
    renderQuiz();
  }
  else if (a==="next"){
    var z2 = S.z; z2.i++; z2.pick = null;
    if (z2.i>=z2.qs.length){
      z2.done = true; var pr = P(S.mod);
      pr.tries++; if (pr.best==null || z2.score>pr.best) pr.best = z2.score;
      pr.last = z2.score; pr.at = Date.now();
      save();
    }
    renderQuiz();
  }
  else if (a==="requiz"){ newQuiz(); renderQuiz(); }
});
app.addEventListener("keydown", function(ev){
  if (ev.key==="Enter" && (ev.target.id==="neuname" || ev.target.id==="pin" || ev.target.id==="pin2")){ ev.preventDefault(); submit(); }
});
document.addEventListener("visibilitychange", function(){ if (document.visibilityState==="hidden" && saveTimer) push(); });
app.addEventListener("input", function(ev){
  if (ev.target.id==="suche"){ S.q = ev.target.value; go(); }
});
window.addEventListener("hashchange", function(){
  if (!me()) return;
  var id = (location.hash||"").replace("#","");
  if (id) openHash(id); else home();
});

if (!me()){ S.view = "who"; renderWho(); }
else {
  var start = (location.hash||"").replace("#","");
  if (!(start && openHash(start))) renderHub();
  syncIn();
}
</script>
