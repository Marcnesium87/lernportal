<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lernportal Übersicht</title>
<style>
:root{--bg:#F2F4F1;--surface:#fff;--fg:#16202B;--muted:#56616D;--line:#D6DCD4;--accent:#0E6A62;--on:#fff;--good:#1E7B3A;--mid:#8A6100;--bad:#B3261E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161C;--surface:#1A222B;--fg:#E9EDF1;--muted:#9AA6B2;--line:#2C3742;--accent:#4CC2B5;--on:#05211E;--good:#5FD08A;--mid:#E8B84A;--bad:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px 48px}
.wrap{max-width:1000px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:1.6rem}
.hint{color:var(--muted);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
button{cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.user{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left}
.user[aria-pressed="true"]{border-color:var(--accent)}
.user b{font-size:1.1rem}
.user span{color:var(--muted);font-size:.92rem}
.tablewrap{overflow-x:auto;background:var(--surface);border:2px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.85rem;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.q{font-weight:700;white-space:nowrap}
.q.good{color:var(--good)}.q.mid{color:var(--mid)}.q.bad{color:var(--bad)}
.err{color:var(--bad);margin:0;min-height:1.4em}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Lernportal Übersicht</h1>
  <form id="login" class="row" autocomplete="off">
    <input id="key" type="password" placeholder="Schlüssel" aria-label="Schlüssel" size="28" autocomplete="off">
    <button class="primary" type="submit">Anzeigen</button>
  </form>
  <p class="err" id="err" role="alert"></p>
  <div id="app" hidden>
    <p class="hint" id="stand"></p>
    <div class="users" id="users" style="margin-block:12px"></div>
    <div class="row" style="margin-bottom:12px">
      <select id="fArt" aria-label="Art"><option value="">Alle Arten</option><option value="quiz">Quiz</option><option value="lernen">Lernen</option><option value="schreiben">Schreiben</option><option value="karten">Lernkarten</option><option value="karte">Kartenquiz</option></select>
      <button id="csv" type="button">Als CSV speichern</button>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>Datum</th><th>Nutzer</th><th>Modul</th><th>Art</th><th>Ergebnis</th><th>Quote</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p class="hint" id="leer" hidden>Keine Einträge für diese Auswahl.</p>
  </div>
</div>
<script>
var API = "https://lernportal.lernportal-lernen.workers.dev";
var ART = {quiz:"Quiz", lernen:"Lernen", schreiben:"Schreiben", karten:"Lernkarten gelesen", karte:"Begriffe gefunden"};
var data = null, nutzer = "";
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function datum(ms){ return new Date(ms).toLocaleString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit", timeZone:"Europe/Berlin"}); }
function tag(ms){ return new Date(ms).toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric", timeZone:"Europe/Berlin"}); }
function quote(e){ return Math.round(e.score / e.total * 100); }
function klasse(p){ return p>=80 ? "good" : p>=50 ? "mid" : "bad"; }
function filtered(){
  var art = document.getElementById("fArt").value;
  return data.events.filter(function(e){ return (!nutzer || e.name===nutzer) && (!art || e.kind===art); });
}
function render(){
  var us = document.getElementById("users"), h = "";
  h += '<button class="user" data-n="" aria-pressed="'+(nutzer==="")+'"><b>Alle Nutzer</b><span>'+data.users.length+' Nutzer, '+data.events.length+' Einträge</span></button>';
  data.users.forEach(function(u){
    var ev = data.events.filter(function(e){ return e.name===u.name; });
    var runs = ev.filter(function(e){ return e.kind==="quiz" || e.kind==="lernen" || e.kind==="schreiben"; });
    var avg = runs.length ? Math.round(runs.reduce(function(s,e){ return s + quote(e); }, 0) / runs.length) : null;
    h += '<button class="user" data-n="'+esc(u.name)+'" aria-pressed="'+(nutzer===u.name)+'"><b>'+esc(u.name)+'</b>'
      + '<span>Zuletzt aktiv: '+(u.last_at ? tag(u.last_at) : 'noch nie')+'</span>'
      + '<span>'+runs.length+' Durchläufe'+(avg==null ? '' : ', Quote im Schnitt '+avg+' %')+'</span></button>';
  });
  us.innerHTML = h;
  var list = filtered(), rows = document.getElementById("rows");
  rows.innerHTML = list.map(function(e){
    var p = quote(e);
    return '<tr><td>'+datum(e.at)+'</td><td>'+esc(e.name)+'</td><td>'+esc(e.title)+'</td><td>'+esc(ART[e.kind]||e.kind)+'</td><td>'+e.score+' von '+e.total+'</td><td class="q '+klasse(p)+'">'+p+' %</td></tr>';
  }).join("");
  document.getElementById("leer").hidden = list.length>0;
}
document.getElementById("users").addEventListener("click", function(ev){
  var b = ev.target.closest("[data-n]"); if (!b) return;
  nutzer = b.getAttribute("data-n"); render();
});
document.getElementById("fArt").addEventListener("change", render);
document.getElementById("csv").addEventListener("click", function(){
  var rows = [["Datum","Nutzer","Modul","Art","Richtig","Gesamt","Quote %"]].concat(filtered().map(function(e){
    return [datum(e.at), e.name, e.title, ART[e.kind]||e.kind, e.score, e.total, quote(e)];
  }));
  var csv = "﻿" + rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(";"); }).join("\r\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = "lernportal-uebersicht.csv"; document.body.appendChild(a); a.click(); a.remove();
});
document.getElementById("login").addEventListener("submit", function(ev){
  ev.preventDefault();
  var err = document.getElementById("err"), key = document.getElementById("key").value;
  err.textContent = "";
  fetch(API + "/api/admin", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({key:key})})
    .then(function(r){ return r.json(); })
    .then(function(r){
      if (!r || !r.ok){ err.textContent = "Schlüssel stimmt nicht."; return; }
      data = r; document.getElementById("key").value = "";
      document.getElementById("stand").textContent = "Stand: " + datum(Date.now()) + " (Zeiten in deutscher Zeit)";
      document.getElementById("app").hidden = false; render();
    })
    .catch(function(){ err.textContent = "Keine Verbindung."; });
});
</script>
</body>
</html>
